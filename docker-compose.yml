# Senderrr - Pure Node.js Stack

services:
  senderrr:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: senderrr
    restart: unless-stopped
    ports:
      - '127.0.0.1:10000:10000'
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-local}
      - PORT=10000
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ENGINE_TYPE=${ENGINE_TYPE:-whatsapp-web.js}
      - SESSION_DATA_PATH=/app/data/sessions
      - PUPPETEER_HEADLESS=${PUPPETEER_HEADLESS:-true}
      - PUPPETEER_ARGS=--no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage,--disable-gpu,--disable-zygote
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_PATH=/app/data/media
      - SCRAPER_TARGET_URLS=${SCRAPER_TARGET_URLS:-}
      - DATABASE_SYNCHRONIZE=true
      - SCRAPER_ACTIVE_HOUR_START=${SCRAPER_ACTIVE_HOUR_START:-0}
      - SCRAPER_ACTIVE_HOUR_END=${SCRAPER_ACTIVE_HOUR_END:-23}
      - AUTOMATION_HOURLY_LIMIT=${AUTOMATION_HOURLY_LIMIT:-500}
      - AUTOMATION_DAILY_LIMIT=${AUTOMATION_DAILY_LIMIT:-5000}
      - AUTOMATION_JITTER_MIN=${AUTOMATION_JITTER_MIN:-0}
      - AUTOMATION_JITTER_MAX=${AUTOMATION_JITTER_MAX:-1}
      - AUTOMATION_QUIET_HOUR_START=${AUTOMATION_QUIET_HOUR_START:-21}
      - AUTOMATION_QUIET_HOUR_END=${AUTOMATION_QUIET_HOUR_END:-3}
      # Local mode runs the broadcast pipeline with no anti-ban throttles.
      # Override any of these (or set DEPLOYMENT_MODE=cloud) to restore them.
      - BROADCAST_DELAY_MIN_MS=${BROADCAST_DELAY_MIN_MS:-0}
      - BROADCAST_DELAY_MAX_MS=${BROADCAST_DELAY_MAX_MS:-0}
      - BROADCAST_BATCH_PAUSE_MIN_MS=${BROADCAST_BATCH_PAUSE_MIN_MS:-0}
      - BROADCAST_BATCH_PAUSE_MAX_MS=${BROADCAST_BATCH_PAUSE_MAX_MS:-0}
      - BROADCAST_RATE_LIMIT_SLEEP_MS=${BROADCAST_RATE_LIMIT_SLEEP_MS:-0}
      - SCRAPER_MAX_RETRIES=${SCRAPER_MAX_RETRIES:-1}
      - WORKER_LOG_WRITES=${WORKER_LOG_WRITES:-false}
      - SCRAPER_LOG_NO_CHANGE=${SCRAPER_LOG_NO_CHANGE:-false}
    volumes:
      - senderrr-data:/app/data
    healthcheck:
      test: [ 'CMD', 'node', '-e', "require('http').get('http://localhost:10000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  # ngrok tunnel for webhook testing (only starts when NGROK_AUTH_TOKEN is set)
  # ngrok:
  #   image: ngrok/ngrok:latest
  #   container_name: senderrr-ngrok
  #   profiles:
  #     - ngrok
  #   ports:
  #     - "4040:4040"
  #   environment:
  #     NGROK_AUTHTOKEN: ${NGROK_AUTH_TOKEN:-}
  #   command: http senderrr:10000 ${NGROK_URL:+--url=}${NGROK_URL}
  #   depends_on:
  #     - senderrr
  #   restart: unless-stopped

volumes:
  senderrr-data:
    name: senderrr_senderrr-data
